<!doctype html><html dir="rtl"><head><meta charset="utf-8"><title>ریسپانسیو و ویجت‌های قابل ویرایش</title><style>
*{box-sizing:border-box}body{margin:0;font:18px/1.6 Arial;background:#f4f6fa}.shell{max-width:1120px;margin:20px auto;padding:16px 5%}.row{display:flex;flex-direction:row-reverse;flex-wrap:nowrap;gap:16px 28px;border:3px solid #5b21b6;border-radius:10px 20px 30px 40px;padding:12px 4%;margin:8px auto;background:white}.cell{width:60%;padding:20px;margin:4px 2px;border:2px dashed #aaa}.cell h2{font-size:36px;margin:0 0 14px}.icon{font-size:40px;margin:4px 7px;padding:3px;border:1px solid #333;border-radius:4px}.action{display:inline-flex;padding:10px 22px;border:2px solid #246;border-radius:8px;margin:7px 11px;background:#356;color:white;font-size:19px}.action-svg{border-top:1px solid red;border-right:2px dashed blue;border-bottom:3px dotted green;border-left:4px double purple}.only-mobile{display:none;padding:7px;border:2px solid teal}.hide-mobile{padding:10px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px 24px}.bi-star::before{content:'★'}.height{height:1100px;background:linear-gradient(#ddd,#fff)}
@media(min-width:1025px){.desktop-width{width:480px}}
@media(max-width:1024px){.row{flex-direction:column;gap:8px;padding:8px;border-width:2px;border-radius:6px}.cell{width:100%;padding:8px;margin:2px 0}.cell h2{font-size:27px}.action{padding:8px 15px;border-width:1px;margin:4px 6px}.grid{grid-template-columns:1fr;gap:10px}.shell{max-width:760px;margin:10px auto}}
@media(max-width:767px){.row{gap:0;padding:0;border:0;border-radius:0;flex-direction:column}.cell{padding:6px;margin:0;border:0}.cell h2{font-size:22px}.action{padding:6px 12px;margin:0;border:0;border-radius:0}.only-mobile{display:block}.hide-mobile{display:none}.icon{font-size:24px;margin:1px 2px;padding:0;border:0}.shell{max-width:none;margin:0;padding:12px}.grid{gap:0}}
</style></head><body><main class="shell"><section class="row"><div class="cell"><h2>عنوان نمونه</h2><p>متن برای بررسی فاصله و اندازه فونت</p><button class="action action-svg" id="svgbutton"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M1 1L20 20"/></svg>دکمه SVG</button><div role="button" id="rolebutton" class="action">دکمه نقش‌دار</div><input type="submit" id="submitbutton" class="action" value="ارسال"><a id="linkbutton" class="action btn" href="#end">لینک دکمه</a></div><i class="fas fa-star icon" id="empty-fa"></i><span class="material-icons icon" id="empty-material">home</span><i class="bi-star icon" id="empty-bi"></i><svg class="icon" width="32" height="32" id="empty-svg"><circle cx="16" cy="16" r="12"/></svg></section><section class="grid"><div class="desktop-width">عرض دسکتاپ باید در موبایل آزاد شود</div><div><h3><i class="fas fa-check"></i>عنوان همراه آیکن خالی</h3></div></section><p class="only-mobile">فقط در موبایل دیده می‌شود</p><div class="hide-mobile">در موبایل مخفی می‌شود</div><div class="social-icons"><a href="https://example.com" id="social-one"><i class="fab fa-github"></i></a><a href="#end" id="social-two"><i class="fab fa-instagram"></i></a></div><ul><li><i class="fas fa-check"></i>آیتم دارای جای آیکن</li></ul><div class="height"></div><footer id="end">پایان</footer></main><script>window.inputScriptRan=true;</script></body></html>
