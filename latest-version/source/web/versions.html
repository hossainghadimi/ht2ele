<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آرشیو نسخه‌ها</title><style>body{font:16px/1.8 Tahoma;background:#101725;color:#e7edf8;max-width:980px;margin:40px auto;padding:24px}a{color:#77dbc7}article{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;padding:18px;background:#19263b;border-radius:10px;margin:12px 0}p{color:#b7c4d9}.file{direction:ltr;overflow-wrap:anywhere}small{color:#a8b8ca}</style><a href="/">← بازگشت به برنامه</a><h1>آرشیو نسخه‌های مستقل</h1><p>فقط ZIPهای موجود فهرست می‌شوند. بسته‌های حذف‌شده بازسازی نمی‌شوند. هر انتشار جدید نام جدا دارد و بستهٔ تجمیعی تکراری ساخته نمی‌شود.</p><main id="files">در حال دریافت فهرست…</main><script>fetch('/api/releases').then(r=>r.json()).then(rows=>{const host=document.querySelector('#files');host.replaceChildren();for(const r of rows.reverse()){const item=document.createElement('article'),a=document.createElement('a'),size=document.createElement('small');a.className='file';a.textContent=r.file;a.href=r.url;size.textContent=(r.bytes/1048576).toFixed(1)+' MB';item.append(a,size);host.append(item)}if(!rows.length)host.textContent='بسته‌ای کنار برنامه یا داخل پوشه versions وجود ندارد.'}).catch(()=>document.querySelector('#files').textContent='فهرست در دسترس نیست.');</script></html>
